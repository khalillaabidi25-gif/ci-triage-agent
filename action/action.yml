# CI Failure Triage Agent — reusable composite GitHub Action.
#
# When a workflow run fails, this action:
#   1. downloads the failed job's logs       (GitHub REST API)
#   2. summarizes the likely root cause       (Groq / Llama)
#   3. posts the summary as a PR comment      (GitHub REST API)
#
# Portability rule: composite actions CANNOT read github.* or secrets.*
# directly (error: "Unrecognized named-value: 'github'/'secrets'"), so
# EVERYTHING enters this action via `inputs:` (config) or step-level `env:`
# supplied by the caller. The caller is responsible for passing them — see
# .github/workflows/ci-failure-triage.yml. Required env from the caller step:
#   GITHUB_TOKEN       <- ${{ github.token }}
#   GITHUB_REPOSITORY  <- ${{ github.repository }}

name: "CI Failure Triage Agent"
description: >
  Triage a failed GitHub Actions run: fetch failed-job logs, diagnose the
  root cause with an LLM, and post the analysis as a PR comment.
inputs:
  run-id:
    description: >
      Workflow run ID to triage. For a workflow_run trigger, the caller
      passes the failed run's ID from the github event context in its own
      workflow. If omitted, the current run's GITHUB_RUN_ID is used.
    required: false
    default: ""
  groq-api-key:
    description: >
      Groq API key to use for the diagnosis. The caller passes it from its
      own secrets registry. Never hardcode or commit the key.
    required: true
  model:
    description: Groq model to use for the diagnosis.
    required: false
    default: "openai/gpt-oss-20b"
  max-log-chars:
    description: Maximum characters of the log sent to the model.
    required: false
    default: "50000"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build

    - name: Triage failed run
      id: triage
      shell: bash
      run: node dist/index.js "${{ inputs.run-id }}"
      env:
        # Runtime context is provided by the CALLER's step-level env —
        # github.* and secrets.* are never readable inside a composite action.
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        MODEL: ${{ inputs.model }}
        MAX_LOG_CHARS: ${{ inputs.max-log-chars }}