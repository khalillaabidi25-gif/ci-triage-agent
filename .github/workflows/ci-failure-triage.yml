# Example: run the triage agent whenever a workflow named "CI" finishes.
#
# Requirements:
#   - The trigger workflow ('CI' below) must exist in this repository.
#   - Repo secrets → Settings → Secrets and variables → Actions:
#       GROQ_API_KEY  (required)
#   - `permissions:` below grant github.token just enough access:
#       actions: read          → fetch run/job/logs
#       pull-requests: write   → post the triage comment on the PR
#   - Important: the default GITHUB_TOKEN *cannot* comment on PRs coming
#     from forks (trusted fork authors must use their own key). For this
#     learning setup, PRs from same-repo branches work out of the box.
#
# Contexts live HERE, not in the action: this workflow is a normal
# workflow where github.* and secrets.* are valid. The composite action
# cannot read them, so we ship them in via `with:` (config) and `env:`
# (runtime context) on the step that calls it.

name: Triage Failed CI

on:
  workflow_run:
    workflows: ["CI"]        # ← name of the pipeline you want to watch
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run failure triage
        uses: ./action
        with:
          run-id: ${{ github.event.workflow_run.id }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}