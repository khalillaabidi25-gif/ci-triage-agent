# Demo pipeline for the triage agent (watched name: "CI").
# Runs the coffee-shop demo-app unit tests. A real bug in the code makes
# this pipeline fail — the triage agent summarizes the failure on the PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install demo-app dependencies
        working-directory: demo-app
        run: npm ci

      - name: Run demo-app unit tests
        working-directory: demo-app
        run: npm test