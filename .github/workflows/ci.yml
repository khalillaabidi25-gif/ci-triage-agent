# DEMO pipeline — deliberately FAILS on purpose.
# This is the workflow the triage agent watches (name must match
# `workflows: ["CI"]` in ci-failure-triage.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Deploy to staging
        # Intended failure: this command does not exist on the runner.
        run: ./deploy-staging.sh --env=staging